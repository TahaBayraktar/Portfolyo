<html lang="tr" translate="no">
  <head>

    <!-- Site logosu (sekme, Google arama sonuçları, ana ekran) -->

    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="Taha Bayraktar | Backend &amp; DevOps Engineer" />

      rel="stylesheet"
    />

    <!-- Tema / renk / dil tercihini ilk boyamadan önce uygula (yanıp sönmeyi önler) -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var tema = localStorage.getItem("theme");
          d.classList.toggle("dark", tema !== "light");
          d.classList.toggle("kirmizi", tema === "red");
          d.dataset.accent = localStorage.getItem("accent") || "cyan";
          var dil = localStorage.getItem("lang");
          if (dil) d.lang = dil;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
